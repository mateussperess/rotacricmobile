services:
  db:
    env_file:
      - .env
    image: mysql:8.0
    container_name: rtcmobile-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - /home/mateus/Downloads/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mysql -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1'",
        ]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    networks:
      - rtcmobile-network

  backend:
    env_file:
      - .env
    volumes:
      - ./src:/api/src
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-backend-new
    restart: unless-stopped
    command: node dist/src/main.js
    depends_on:
      db:
        condition: service_healthy
    network_mode: 'host'
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_TARGET=${DB_TARGET:-local}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL}
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@127.0.0.1:3308/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 15s

volumes:
  mysql_data:
    driver: local

networks:
  rtcmobile-network:
    driver: bridge
