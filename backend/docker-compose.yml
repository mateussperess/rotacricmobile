services:
  backend:
    env_file:
      - .env
    volumes:
      - ./src:/api/src
      - ./dist:/api/dist
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-backend-new
    restart: unless-stopped
    command: node dist/src/main.js
    network_mode: 'host'
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_TARGET=${DB_TARGET}
      - PROD_DATABASE_URL=${PROD_DATABASE_URL}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      timeout: 5s
      retries: 5
      interval: 30s
      start_period: 15s

